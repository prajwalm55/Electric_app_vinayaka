services:
  garage:
    image: dxflrs/garage:v2.0.0
    container_name: veew-garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-storage:/var/lib/garage
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # RPC
      - "3902:3902" # Web (static website hosting)
      - "3903:3903" # Admin API

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: veew-garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "3909:3909"
    environment:
      - AUTH_USER_PASS=admin:admin12345
      - API_BASE_URL=http://garage:3903
      - S3_ENDPOINT_URL=http://localhost:3900

volumes:
  garage-storage: {}
