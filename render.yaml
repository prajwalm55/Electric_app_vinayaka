services:
  - type: web
    name: veew-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: STORAGE_DRIVER
        value: postgres
      - key: DATABASE_SSL
        value: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # TEMPORARY DEMO ONLY: change to false before production.
      - key: DEMO_MODE
        value: true
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: veew-documents
      - key: S3_USE_PATH_STYLE
        value: true

  - type: static_site
    name: veew-client
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Vite/React Router needs the app shell for direct URL loads and refreshes.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      # TEMPORARY DEMO ONLY: change to false before production.
      - key: VITE_DEMO_MODE
        value: true
